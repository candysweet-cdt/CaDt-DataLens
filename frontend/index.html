<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>JsonLens</title>
    <link rel="stylesheet" href="/vendor/jsoneditor.min.css"/>
    <script src="/vendor/jsoneditor.min.js"></script>
</head>
<body>
<div id="app">
    <header id="toolbar">
        <div class="brand">JsonLens</div>
        <div id="filename" class="filename">未打开文件</div>
        <div class="spacer"></div>
        <button id="btn-open" class="tb-btn" title="打开 (Ctrl+O)">打开</button>
        <button id="btn-save" class="tb-btn primary" title="保存 (Ctrl+S)" disabled>保存</button>
        <div id="win-controls">
            <button id="wc-min" class="wc-btn" title="最小化">&#xE921;</button>
            <button id="wc-max" class="wc-btn" title="最大化 / 还原">&#xE922;</button>
            <button id="wc-close" class="wc-btn wc-close" title="关闭">&#xE8BB;</button>
        </div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <div id="editor-wrap">
        <div id="editor" class="hidden"></div>
        <div id="welcome">
            <div class="welcome-title">JsonLens</div>
            <div class="welcome-sub">拖入 .json 文件到窗口，或</div>
            <button id="btn-welcome-open" class="tb-btn primary">打开文件 (Ctrl+O)</button>
        </div>
    </div>
    <footer id="statusbar">
        <span id="st-mode"></span>
        <span id="st-size"></span>
        <span id="st-eol"></span>
        <span id="st-enc"></span>
        <div class="spacer"></div>
        <span id="st-message"></span>
        <span id="st-dirty"></span>
    </footer>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
